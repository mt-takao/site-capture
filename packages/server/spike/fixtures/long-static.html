<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>通常の長いページ</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  header { position: sticky; top: 0; background: #222; color: #fff; padding: 16px; }
  section { height: 1000px; border-bottom: 4px solid #000; padding: 24px; box-sizing: border-box; }
  section:nth-child(odd) { background: #eef; }
  img { display: block; width: 320px; height: 180px; background: #ccc; }
</style></head>
<body>
<header>通常の長いページ（高さ約 25,000px、画像は遅延読み込み）</header>
<main id="sections"></main>
<script>
  // 25 個の区画。各区画に遅延読み込み画像を置く（区画番号を描いた SVG）
  const main = document.getElementById('sections');
  for (let i = 1; i <= 25; i++) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180"><rect width="320" height="180" fill="hsl(${i*14},70%,60%)"/><text x="20" y="110" font-size="72" fill="#000">IMG ${i}</text></svg>`;
    main.insertAdjacentHTML('beforeend',
      `<section><h2>区画 ${i} / 25</h2><img loading="lazy" alt="" src="data:image/svg+xml,${encodeURIComponent(svg)}"></section>`);
  }
</script>
</body></html>
