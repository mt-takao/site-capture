<html lang="ja"><head><meta charset="utf-8"><title>裏のAPIが制限されるページ</title></head>
<body>
<h1>裏のAPIが 429 を返すページ</h1>
<div id="data">読み込み中…</div>
<script>
  fetch('/api/limited').then((r) => { document.getElementById('data').textContent = r.ok ? '読み込み完了' : '読み込み失敗'; });
</script>
</body></html>
