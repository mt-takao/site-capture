<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>APIの429から回復するページ</title></head>
<body>
<h1>API が1回目だけ 429 を返し、ページ側が再送して回復するページ</h1>
<div id="data">読み込み中…</div>
<script>
  // Notion のように、429 を受けたら少し待って同じ要求を送り直す
  async function load(attempt = 0) {
    const r = await fetch('/api/once-429', { method: 'POST', body: '{"page":1}' });
    if (r.status === 429 && attempt < 3) return setTimeout(() => load(attempt + 1), 500);
    document.getElementById('data').textContent = r.ok ? '読み込み完了' : '読み込み失敗';
  }
  load();
</script>
</body></html>
