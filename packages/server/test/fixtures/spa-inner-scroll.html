<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>内側スクロールのSPA（Notion風）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 16px system-ui; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 240px; flex: none; background: #f4f4f2; padding: 16px; box-sizing: border-box; }
  .frame { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 44px; flex: none; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 16px; }
  .scroller { flex: 1; overflow-y: auto; }
  .page { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  .block { min-height: 120px; margin: 12px 0; padding: 16px; border-radius: 8px; background: #fafafa; border: 1px solid #e5e5e5; }
  .block.pending { background: repeating-linear-gradient(45deg,#eee,#eee 10px,#f8f8f8 10px,#f8f8f8 20px); }
  .banner { position: fixed; right: 16px; bottom: 16px; background: #000; color: #fff; padding: 12px 16px; border-radius: 8px; }
  @media (max-width: 600px) { .sidebar { display: none; } }
</style></head>
<body>
<div id="root"></div>
<script>
  // Notion と同じく、HTML 読み込み時点では空。0.8 秒後に JS で画面を組み立てる。
  // 本文の各ブロックは画面に入ったときに初めて中身を描画し、一度描画したら残す。
  setTimeout(() => {
    document.getElementById('root').innerHTML = `
      <div class="app">
        <nav class="sidebar">サイドバー<br>・ページA<br>・ページB</nav>
        <div class="frame">
          <div class="topbar">トップバー（固定）</div>
          <div class="scroller"><div class="page"><h1>内側スクロールのページ</h1><div id="blocks"></div><p id="end">— ページの末尾 —</p></div></div>
        </div>
      </div>
      <div class="banner">Notionで開く（隠す対象のバナー）</div>`;
    const blocks = document.getElementById('blocks');
    const io = new IntersectionObserver(entries => {
      for (const e of entries) {
        if (!e.isIntersecting || !e.target.classList.contains('pending')) continue;
        const el = e.target;
        setTimeout(() => {
          el.classList.remove('pending');
          el.innerHTML = `<strong>ブロック ${el.dataset.n} / 40</strong><p>画面に入ってから描画された本文です。</p>`;
        }, 200);
      }
    }, { root: document.querySelector('.scroller') });
    for (let i = 1; i <= 40; i++) {
      const b = document.createElement('div');
      b.className = 'block pending';
      b.dataset.n = i;
      blocks.appendChild(b);
      io.observe(b);
    }
  }, 800);
</script>
</body></html>
